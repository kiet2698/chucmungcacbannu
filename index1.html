<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10 - Cô Ngân</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a0b2e, #4a154b, #7b1fa2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
        }

        /* --- INTRO MỞ MÀN HOÀNH TRÁNG --- */
        #intro-screen {
            position: absolute;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeOutIntro 1s ease 4s forwards;
            pointer-events: none;
            width: 100%;
            height: 100%;
            background: rgba(26, 11, 46, 0.95);
        }

        .gift-box {
            font-size: 80px;
            animation: bounceGift 1.5s infinite alternate;
            cursor: pointer;
            pointer-events: auto;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        @keyframes bounceGift {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-20px) scale(1.1); }
        }

        .intro-title {
            font-size: 28px;
            color: #ffd700;
            margin-top: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; transform: scale(1.05); }
        }

        @keyframes fadeOutIntro {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* --- KHUNG CUỘN BÀI THƠ / LỜI CHÚC --- */
        #poem-container {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 10;
            animation: fadeInMain 1.5s ease forwards;
        }

        @keyframes fadeInMain {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #poem-scroll {
            position: absolute;
            width: 100%;
            top: 100%;
            animation: scrollUp 40s linear forwards;
            padding: 0 30px;
        }

        @keyframes scrollUp {
            0% { top: 100%; }
            100% { top: -140%; }
        }

        .poem-line {
            font-size: 23px;
            line-height: 2.6;
            margin-bottom: 14px;
            text-shadow: 0 3px 10px rgba(0,0,0,0.8);
            font-weight: 400;
            color: #fce4ec;
        }

        .highlight-title {
            font-size: 34px;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(255,215,0,0.6);
        }

        .highlight-name {
            font-size: 38px;
            color: #ff4081;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(255,64,129,0.8);
        }

        .highlight-teacher {
            color: #00e5ff;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,229,255,0.6);
        }

        .final-wish {
            font-size: 26px;
            color: #ff80ab;
            font-style: italic;
            margin-top: 35px;
            margin-bottom: 60px;
            line-height: 2.2;
        }

        /* --- HIỆU ỨNG CƠN MƯA HOA & TRÁI TIM --- */
        .heart {
            position: absolute;
            top: -10%;
            z-index: 2;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(60px) rotate(360deg);
                opacity: 0.15;
            }
        }
    </style>
</head>
